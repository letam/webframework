# Development only. Production dependencies and credentials are instance-specific.
services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: webframework
      POSTGRES_USER: webframework
      POSTGRES_PASSWORD: webframework-local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - presence-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webframework -d webframework"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4.8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  presence-postgres:
