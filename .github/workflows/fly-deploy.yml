# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  # push:    # Uncomment this to trigger on push to main
  #   branches:
  #     - main
  workflow_dispatch:  # Add this to allow manual triggering
jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml
  deploy:
    name: Deploy app
    needs: tests
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --config is required: the root fly.toml is a stale reference snapshot
      # (see CLAUDE.md "Deployment"). fly-sqlite.toml is the production config.
      - run: flyctl deploy --remote-only --config admin/configs/fly-sqlite.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  # If using storage volume, i.e. to persist SQLite database, then uncomment to activate the following job:
