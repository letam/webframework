# Test, lint, and build gates. Runs on every push/PR to main, and is reused by
# the deploy workflow (workflow_call) so deploy-blocking checks stay green.

name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The repo config sets [tool.ruff] fix=true; CI must never mutate files.
      - run: uvx ruff@0.15.20 check --no-fix server/ admin/dev/check-presence-processes.py
      - run: uvx ruff@0.15.20 format --check server/ admin/dev/check-presence-processes.py

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Media tests exercise ffprobe/ffmpeg integration
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # settings.py auto-creates a dev server/.env on first run. The 'apps'
      # label is required: bare 'test' from the repo root discovers 0 tests.
      - run: uv run python server/manage.py test apps
  realtime:
    name: Presence (Postgres + Redis + Daphne)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: presence_test
          POSTGRES_USER: presence_test
          POSTGRES_PASSWORD: presence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U presence_test -d presence_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
      redis:
        image: redis:7.4.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      SECRET_KEY: ci-test-key-only
      DEBUG: 'True'
      USE_LOCAL_FILE_STORAGE: 'True'
      DATABASE_URL: postgresql://presence_test:presence_test@127.0.0.1:5432/presence_test
      REALTIME_ENABLED: 'True'
      ASGI_ENABLED: 'True'
      PRESENCE_ENABLED: 'True'
      REALTIME_REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      REALTIME_PREFIX: ci-presence
      PRESENCE_HASH_KEY: ci-only-hmac-key-with-at-least-32-characters
      PRESENCE_STATS_TOKEN: ci-only-bearer-token-with-at-least-32-characters
      PRESENCE_SCOPES: '{"reading":{"origins":["http://localhost:5173"]}}'
      REQUIRE_REALTIME_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run python server/manage.py test apps.presence
      - run: uv run python admin/dev/check-presence-processes.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Scoped name, not bare `biome`: that resolves an unrelated package whose
      # bin exits 0 silently, so this gate checked nothing. Pinned like ruff above.
      # Keep this version in step with the root package.json devDependency and
      # biome.json's $schema — nothing enforces it, and a drifted pin means CI
      # quietly enforces a different Biome than anyone runs locally.
      - run: bunx @biomejs/biome@2.3.11 ci .
      # -b, not --noEmit: the root tsconfig is a solution file with "files": [],
      # so a plain `tsc` there checks nothing and passes unconditionally. The
      # script spells out the TS 7 binary because `typescript` (TS 6, kept for
      # typescript-eslint) also ships a `tsc`, and which one wins node_modules/.bin
      # is install-order luck.
      - run: bun run typecheck
      # ESLint is the sole reason the TS 6 alias is installed alongside TS 7
      # (typescript-eslint can't load TS 7 yet). Gating it here is what keeps that
      # second install justified. See CLAUDE.md, "Two TypeScript versions".
      - run: bun run lint
      # `bun run test` is `vitest run` (single pass, not watch) — the same command
      # a dev runs locally, so CI and local can't diverge.
      - run: bun run test
      - run: bun run build

  e2e:
    name: Playwright e2e
    # Reusable deploy runs skip e2e for flaky-browser-test protection; every
    # push and PR still runs the browser suite.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python server/manage.py migrate --noinput
      - run: uv run python server/manage.py init_users
        env:
          DJANGO_SUPERUSER_USERNAME: e2e_admin
          DJANGO_SUPERUSER_PASSWORD: e2e_admin_password
      - name: Start backend
        run: |
          (PYTHONPATH=server ASGI_ENABLED=True uv run daphne -b 0.0.0.0 -p 8000 --websocket-max-message-size 2048 --websocket-max-frame-size 2048 config.asgi:application) > /tmp/django-asgi.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/healthz/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/django-asgi.log
          echo "Backend did not become ready" >&2
          exit 1
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: app
      # The CSP hash test for the built shell is skipped without a production
      # build on disk, and this is the only job with both toolchains — the
      # frontend job has no Python, the backend job no bun. Without this step
      # nothing in CI checks the file the browser actually enforces hashes
      # against — exactly the regression "fix(csp): allowlist the built SPA
      # shell's theme script, not the DEBUG-only one" fixed. Named rather than
      # cited by SHA: a squash-merge or rebase rewrites it. Mirrors the
      # Dockerfile: copy the built index.html, then stamp the timestamp comment.
      - name: Build the production SPA shell
        run: bun run build
        working-directory: app
      - name: Check CSP hashes against the built shell
        env:
          REQUIRE_BUILT_SHELL: '1'
        run: |
          dist=server/apps/website/templates/website/dist
          mkdir -p "$dist"
          cp app/dist/index.html "$dist/index.html"
          sed -i "s|<!-- TIMESTAMP -->|<!-- TIMESTAMP: $(date +'%Y-%m-%d %H:%M:%S %Z') -->|" \
            "$dist/index.html"
          uv run python server/manage.py test apps.blogs.tests.test_csp_hashes
      # Cache the downloaded browser binaries, keyed on the lockfile so a
      # @playwright/test bump re-downloads. --with-deps still runs on a cache
      # hit (it also installs apt libs, which aren't cached), but skips the
      # ~100 MB browser download.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: bunx playwright install --with-deps chromium
        working-directory: app
      - name: Configure frontend dev env
        run: |
          cat > app/.env.development.local <<'EOF'
          VITE_SERVER_HOST=//localhost:8000
          VITE_UPLOAD_FILES_TO_S3=false
          EOF
      - run: bun run test:e2e
        working-directory: app
      # On failure, keep the HTML report plus traces/screenshots so a red run is
      # debuggable without re-running locally. `if: failure()` scopes the upload
      # to failed runs; a green run leaves no artifact.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7
