[project]
name = "web-framework"
version = "0.0.6"

description = "Web framework"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "boto3==1.43.49",
    "dj-database-url==3.1.2",
    "django-cors-headers==4.9.0",
    "django-csp==4.0",
    "django-extensions==4.1",
    "django-storages==1.14.6",
    "django-tasks-db==0.12.0",
    "django-tasks==0.12.0",
    "django==6.1",
    "djangorestframework==3.18.0",
    "environs[django]>=15.0.1",
    "gunicorn==26.0.0",
    "httpx>=0.28.1",
    "openai==2.45.0",
    "pillow==12.3.0",
    "psycopg-binary==3.3.4",
    "psycopg-pool==3.3.1",
    "psycopg==3.3.4",
    "sentry-sdk==2.65.0",
    "werkzeug==3.1.8",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs==6.1.0",
    "djangorestframework-stubs[compatible-mypy]>=3.17.0",
    "ipython==9.15.0",
    "neovim==0.3.1",
]

[tool.ruff]
# https://docs.astral.sh/ruff/settings/

# Target Python version
target-version = "py313" # change to match your Django project's Python version

# Exclude migrations from strict linting
exclude = [
  "**/migrations/**",
]

# Max line length (optional)
line-length = 99

# Enable autofix on save
fix = true

# Optional: Restrict to specific paths (e.g., Django apps)
# extend-include = ["*.py"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
# Include common linting rules and Django-specific rules
select = [
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort (import sorting)
  "DJ", # Django-specific rules
  "D", # pydocstyle (docstring checks)
  "B", # flake8-bugbear
  "N", # pep8-naming
  "UP", # pyupgrade
]

# Docstring convention
[tool.ruff.lint.pydocstyle]
convention = "google" # or "numpy", "pep257"

# Pyright config lives in pyrightconfig.json (the root file). When both exist,
# pyright reads pyrightconfig.json and ignores [tool.pyright] here entirely, so a
# second copy in this file would be silently dead. Keep it in one place.

[tool.django-stubs]
# django_settings_module = "config.settings"
